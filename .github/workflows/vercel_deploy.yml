name: Release to Vercel

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "AGENTS.md"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: production-vercel
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  Vercel-Production-Deployment:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: git-checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: |
          curl -sL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
          sudo mv trunk /usr/local/bin/trunk

      - name: Build with Trunk
        run: trunk build --release

      - name: Guard Trunk output
        run: |
          test -f dist/index.html
          test -f dist/mark.js
          test -f dist/og.jpg
          test -f dist/robots.txt
          if grep -q 'data-trunk' dist/index.html; then
            echo "dist/index.html still has data-trunk — refusing to ship the source page"
            exit 1
          fi
          if ! grep -q '\.wasm' dist/index.html; then
            echo "dist/index.html has no wasm — refusing to ship"
            exit 1
          fi
          if ! grep -q 'og:image' dist/index.html; then
            echo "dist/index.html has no og:image — refusing to ship"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Trunk dist
        id: deployment
        run: |
          vercel deploy ./dist --prod --yes --token=${{ secrets.VERCEL_TOKEN }} >> $GITHUB_STEP_SUMMARY
