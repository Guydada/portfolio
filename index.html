    <script>
      let iconUrl = "";
      function paintChrome() {
        const dark = document.documentElement.dataset.theme === "dark";
        const bg = dark ? "#111111" : "#f7f6f2";
        const fg = dark ? "#f4f4f1" : "#111111";
        const svg =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
          '<rect width="32" height="32" fill="' +
          bg +
          '"/>' +
          '<path d="M22.4 10.6A8.4 8.4 0 1 0 22.4 21.4" fill="none" stroke="' +
          fg +
          '" stroke-width="2.3" stroke-linecap="square"/>' +
          '<path d="M15.5 16h8.6" fill="none" stroke="' +
          fg +
          '" stroke-width="2.3" stroke-linecap="square"/>' +
          "</svg>";
        if (iconUrl) URL.revokeObjectURL(iconUrl);
        iconUrl = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
        document
          .querySelectorAll("link[rel='icon'], link[rel='shortcut icon']")
          .forEach((node) => node.remove());
        const link = document.createElement("link");
        link.rel = "icon";
        link.type = "image/svg+xml";
        link.href = iconUrl;
        document.head.appendChild(link);
        const theme = document.querySelector("meta[name='theme-color']");
        if (theme) theme.content = bg;
      }
      window.paintChrome = paintChrome;
      try {
        const stored = localStorage.getItem("theme");
        const dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
      paintChrome();
      new MutationObserver(paintChrome).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["data-theme"],
      });
      document.addEventListener("click", (event) => {
        if (event.target.closest && event.target.closest(".theme-toggle")) {
          setTimeout(paintChrome, 0);
          setTimeout(paintChrome, 80);
        }
      });
    </script>
