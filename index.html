<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guy Dahan — Senior Solutions Architect</title>
    <meta
      name="description"
      content="Live resume of Guy Dahan, senior solutions architect and AI engineer. Edge computer vision, generative AI, and agentic systems."
    />
    <meta name="theme-color" content="#111111" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23111111'/><text x='32' y='44' text-anchor='middle' font-family='Georgia' font-size='28' fill='%23f4f4f1'>GD</text></svg>"
    />
    <link data-trunk rel="css" href="style.css" />
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" />
    <script>
      try {
        const stored = localStorage.getItem("theme");
        const dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (err) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body></body>
</html>
